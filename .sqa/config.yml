      gitlab.com/MondaicSupport/collaborations/dt-geo get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.skimpy-green-mongoose.sh
        container: qc.ver_ugly-periwinkle-meerkat
timeout: 5400
